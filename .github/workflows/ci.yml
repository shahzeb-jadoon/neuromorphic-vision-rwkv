name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with flake8
        run: |
          if [ -d src ]; then
            flake8 src/ --max-line-length=100 --extend-ignore=E203,W503
          else
            echo "src/ not found — skipping lint (expected until Phase 1)"
          fi

      - name: Format check with black
        run: |
          if [ -d src ]; then
            black --check --line-length 100 src/
          else
            echo "src/ not found — skipping format check (expected until Phase 1)"
          fi

      - name: Type check with mypy
        run: |
          if [ -d src ]; then
            mypy src/ --config-file pyproject.toml
          else
            echo "src/ not found — skipping type check (expected until Phase 1)"
          fi


      - name: Run unit tests
        run: |
          if [ -d tests ]; then
            pytest tests/ -v --cov=src/ --cov-report=term-missing
          else
            echo "tests/ not found — skipping tests (expected until Phase 1)"
          fi
