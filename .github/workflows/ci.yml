name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with flake8
        run: flake8 src/ scripts/ --max-line-length=100 --extend-ignore=E203,W503

      - name: Format check with black
        run: black --check --line-length 100 src/ scripts/

      - name: Type check with mypy
        run: mypy src/ --config-file pyproject.toml

      - name: Run offline unit tests
        run: pytest tests/ -v -m "not online" --cov=src/ --cov-report=term-missing --cov-config=pyproject.toml
