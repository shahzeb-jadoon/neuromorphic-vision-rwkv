name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install the locked environment
        run: |
          pip install -r requirements-lock.txt
          pip install -e . --no-deps

      - name: Lint and formatting
        run: make lint format

      - name: Type check
        run: make typecheck

      - name: Offline tests with coverage
        run: make test

      - name: Smoke training run (CPU)
        run: make smoke
