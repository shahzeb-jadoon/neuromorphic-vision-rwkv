repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: conda run --no-capture-output -n rwkv ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: conda run --no-capture-output -n rwkv ruff format --force-exclude
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: conda run --no-capture-output -n rwkv mypy
        language: system
        types: [python]
        args: ['--config-file=pyproject.toml', 'scripts/', 'src/', 'tests/']
        pass_filenames: false
        exclude: '^agents/'
