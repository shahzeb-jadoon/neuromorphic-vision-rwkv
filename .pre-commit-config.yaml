repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        args: ['--line-length=100']
        language_version: python3.11
        exclude: '^agents/'

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        additional_dependencies: ['flake8-pyproject>=1.2']
        exclude: '^agents/'

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: conda run --no-capture-output -n rwkv mypy
        language: system
        types: [python]
        args: ['--config-file=pyproject.toml', 'scripts/', 'src/', 'tests/']
        pass_filenames: false
        exclude: '^agents/'
