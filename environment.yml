name: rwkv
# -----------------------------------------------------------------------------
# Reproducible environment for neuromorphic-vision-rwkv (Linux x86_64, glibc >= 2.31).
#
# conda supplies only the interpreter and pip. Every Python package comes from
# requirements-lock.txt (exact versions with sha256 hashes), so a single
# installer owns site-packages. Mixing conda and pip packages previously left
# two numpy versions overlapping in one environment.
#
# Create:   conda env create -f environment.yml          # env name: rwkv
#           conda run -n rwkv pip install -e . --no-deps
# Verify:   conda run -n rwkv make env-check
# Re-pin:   edit pyproject.toml, then `make lock`
#
# CUDA: the lock pulls PyTorch wheels built for CUDA 12.4 (cu124), which bundle
# their own CUDA runtime; only an NVIDIA driver is required on the host.
# -----------------------------------------------------------------------------
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - -r requirements-lock.txt
