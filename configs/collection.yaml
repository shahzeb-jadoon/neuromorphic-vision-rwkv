# Collection configuration — defaults for data collection campaign
# Override via CLI flags or by specifying a different config file

carla:
  host: auto           # "auto" = detect Windows host IP from WSL2 gateway
  port: 2000
  timeout: 30.0
  fps: 20              # Fixed timestep = 0.05s
  synchronous: true

# --- 3-Camera panoramic setup ---
# Each camera at 60° FOV, yawed left/centre/right for 180° total coverage.
# Stitched panoramic stored as single (H, W_total, 3) array in HDF5.
cameras:
  n_cameras: 3
  per_camera_width: 640
  per_camera_height: 320
  fov: 60
  # Yaw offsets in degrees (left, centre, right)
  yaw_offsets: [-60, 0, 60]
  # Mounting position (vehicle frame, metres)
  position:
    x: 1.5              # forward from vehicle centre
    z: 2.4              # height above ground

# --- Expert agent (PrivilegedExpert) ---
expert:
  type: privileged_expert
  target_speed: 30.0     # km/h
  max_speed: 50.0
  # PID tuning — gains for RAW km/h error (P4-C)
  speed_pid: [0.07, 0.005, 0.002]
  steer_pid: [1.2, 0.05, 0.15]
  # Safety
  traffic_light_brake_distance: 80.0
  vehicle_hazard_distance: 25.0
  pedestrian_hazard_distance: 15.0
  turn_speed_factor: 0.45

# Towns for training data collection
towns:
  - Town01
  - Town03
  - Town04
  - Town05
  - Town06
  - Town07
  - Town10HD
  - Town12
  - Town15

# Towns reserved for closed-loop evaluation only (never collected for training)
eval_towns:
  - Town02

# Weather presets to cycle through
weathers:
  - ClearNoon
  - CloudyNoon
  - WetNoon
  - SoftRainNoon
  - HardRainNoon
  - ClearSunset
  - CloudySunset
  - WetSunset
  - MidRainyNoon
  - SoftRainSunset

# Traffic density settings
traffic:
  vehicles: [20, 50, 100]     # Sparse, medium, dense
  walkers: [10, 30, 50]

# Route generation
routes:
  strategy: balanced           # "random" or "balanced"
  target_distribution:
    lane_follow: 0.60
    left: 0.15
    right: 0.15
    straight: 0.10
  min_route_length: 100        # Minimum waypoints
  max_route_length: 500        # Maximum waypoints

# Episode settings
episode:
  max_frames: 4000             # ~200 seconds at 20 FPS
  timeout_speed: 0.1           # m/s — below this for timeout_duration → discard
  timeout_duration: 75         # seconds stuck before timeout
  crash_retries: 3             # CARLA reconnection attempts
  crash_wait: 30               # seconds to wait between retries

# Output
output:
  directory: data/collected

# Future-proofing: extra data to store per frame (negligible cost)
extras:
  store_position: true         # Vehicle (x,y,z) world coordinates
  store_rotation: true         # Vehicle (pitch,yaw,roll)
  store_traffic_light: true    # Traffic light state per frame
  store_nearby_vehicles: true  # Up to 10 nearest vehicles (distance, speed, lane)
  store_nearby_pedestrians: true  # Up to 5 nearest pedestrians
  compression: gzip
  compression_level: 1
  manifest: collection_manifest.json

# Reproducibility
seed: 42
